<main id="main" class="wrap code-index">
  <header class="lesson-head">
    <h1>{{title}}</h1>
    <p class="meta">{{intro}}</p>
  </header>
  <div class="prog-filter" hidden>
    <input
      type="search"
      placeholder="{{filter_label}}"
      aria-label="{{filter_label}}"
      autocomplete="off"
      spellcheck="false"
    />
  </div>
  <p class="prog-empty" hidden>{{no_results}}</p>
  <div class="code-groups">{{groups}}</div>
</main>
