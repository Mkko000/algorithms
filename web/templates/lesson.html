<main id="main" class="wrap layout">
<article class="reading">
<header class="lesson-head">
<p class="context">{{context}}</p>
<h1>{{title}}</h1>
<p class="meta">{{meta}}</p>
</header>
<div class="lesson-body">
{{body}}
</div>
<nav class="pager">{{prev}}<button type="button" class="done-btn" data-slug="{{slug}}" data-label="{{mark_done}}" data-done="{{done}}" aria-pressed="false">{{mark_done}}</button>{{next}}</nav>
</article>
{{toc}}
</main>
