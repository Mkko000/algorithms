[[t]]
ar = "شجرة الـ recurrence <code>C(N) = 2C(N/2) + N</code> لـ N = 16: كل مستوى مجموع أرقامه 16 (= N)، وفيه lg N = 4 مستويات تحت الجذر — فالمجموع N lg N. ده البرهان «بالرسم» لـ Formula 2.4."
en = "The recurrence tree for <code>C(N) = 2C(N/2) + N</code> with N = 16: the numbers on every level add up to 16 (= N), and there are lg N = 4 levels under the root, so the total is N lg N. This is the proof of Formula 2.4 \"by picture\"."
