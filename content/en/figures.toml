[[t]]
ar = "الـ 15 حركة بتوع Hanoi لـ 4 أقراص (تمرين 5.22–5.23): صف «disk» هو نفسه علامات المسطرة (1 2 1 3 1 2 1 4 …)، والقرص اللي بيتحرك في الخطوة i = 1 + عدد الأصفار في آخر i بالـ binary. والأقراص الفردية (أزرق) دايمًا بتمشي في اتجاه واحد (←)، والزوجية (بنفسجي) في الاتجاه التاني (→)."
en = "The 15 moves of Hanoi with 4 disks (exercises 5.22 and 5.23): the \"disk\" row is exactly the ruler marks (1 2 1 3 1 2 1 4 …), and the disk moved at step i = 1 + the number of trailing zeros of i in binary. The odd disks (highlighted) always move in one direction (←), and the even disks (outlined) in the other (→)."

[[t]]
ar = "شجرة Fibonacci ارتفاعها 5 (تمرين 5.73): تحت الجذر شجرة Fibonacci ارتفاعها 4 على الشمال و3 على اليمين، وهكذا لحد تحت. فيها 12 node و13 external node (الخطوط المتقطعة). يعني N + 1 = F<sub>7</sub> = 13. وفي كل node، الفرق بين ارتفاع الشمال واليمين بالظبط 1، وده أسوأ توازن ممكن لشجرة AVL."
en = "A Fibonacci tree of height 5 (exercise 5.73): under the root is a Fibonacci tree of height 4 on the left and 3 on the right, and so on all the way down. It has 12 nodes and 13 external nodes (the dashed lines). So N + 1 = F<sub>7</sub> = 13. At every node, the heights of the left and right subtrees differ by exactly 1, which is the worst possible balance for an AVL tree."

[[t]]
ar = "شجرة divide-and-conquer لـ N = 11 (تمرين 5.74): كل node مكتوب فيها حجم المسألة، وبتتقسم ⌊N/2⌋ و⌈N/2⌉. الأوراق البنفسجي هي الـ 11 مسألة اللي حجمها 1. مجموع أعماقهم = 39، وده بين N lg N = 38.1 وN lg N + N = 49.1 (تمرين 5.75)."
en = "The divide and conquer tree for N = 11 (exercise 5.74): each node shows the size of its problem, which splits into ⌊N/2⌋ and ⌈N/2⌉. The outlined leaves are the 11 problems of size 1. The sum of their depths = 39, which lies between N lg N = 38.1 and N lg N + N = 49.1 (exercise 5.75)."
