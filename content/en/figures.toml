[[t]]
ar = "شجرة الـ recurrence <code>C(N) = 2C(N/2) + N</code> لـ N = 16: كل مستوى مجموع أرقامه 16 (= N)، وفيه lg N = 4 مستويات تحت الجذر — فالمجموع N lg N. ده البرهان «بالرسم» لـ Formula 2.4."
en = "The recurrence tree for <code>C(N) = 2C(N/2) + N</code> with N = 16: the numbers on every level add up to 16 (= N), and there are lg N = 4 levels under the root, so the total is N lg N. This is the proof of Formula 2.4 \"by picture\"."

[[t]]
ar = "عايزين ندخّل <b>C</b> بعد العقدة x (اللي فيها B)."
en = "We want to insert <b>C</b> after node x (the one holding B)."

[[t]]
ar = "عملنا عقدة جديدة t فيها C (لسه مش متوصّلة بحاجة)."
en = "We made a new node t holding C (not linked to anything yet)."

[[t]]
ar = "السطر الأول: <code>t->next = x->next</code> (C بقت بتشاور على D)، والتاني: <code>x->next = t</code>. لو عكست الترتيب، D والباقي يضيعوا."
en = "The first line: <code>t->next = x->next</code> (C now points to D), and the second: <code>x->next = t</code>. If you swap the order, D and the rest are lost."

[[t]]
ar = "والحذف بعد x: <code>t = x->next; x->next = t->next; free(t);</code> — رجعنا للأول."
en = "And deleting after x: <code>t = x->next; x->next = t->next; free(t);</code> brings us back to the start."

[[t]]
