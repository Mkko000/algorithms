[[t]]
ar = "تتبّع <b>quick-find</b> على أزواج الكتاب: السطر الأول أرقام الخانات، وكل سطر بعده هو <code>id[]</code> بعد الزوج المكتوب على الشمال. الخانات الملوّنة هي اللي اتغيرت — لاحظ إن union واحد ممكن يغيّر خانات كتير (ده سبب الـ N في كل union). السطور الباهتة: الزوج كان متوصّل أصلًا."
en = "A trace of <b>quick find</b> on the book's pairs: the first row is the index of each entry, and every row after it is <code>id[]</code> after the pair written on the left. The highlighted entries are the ones that changed. Notice that a single union can change many entries (that is where the N in every union comes from). Faded rows: the pair was already connected."

[[t]]
ar = "أسوأ حالة لـ quick-union من غير وزن: الأزواج 0-1، 1-2، 2-3… بتعمل «سلسلة» ارتفاعها N−1، وكل find على 0 بيمشي المسار كله."
en = "The worst case for quick union without weighting: the pairs 0-1, 1-2, 2-3… build a \"chain\" of height N−1, and every find on 0 walks the whole path."

[[t]]
ar = "البداية: كل عنصر شجرة لوحده."
en = "The start: every item is a tree on its own."

[[t]]
ar = "3-4: شجرة 4 (الأصغر أو مساوية) بقت تحت 3. الأصغر دايمًا تحت الأكبر، فالارتفاع مايزيدش عن lg N."
en = "3-4: the tree of 4 (smaller or equal) now hangs under 3. The smaller tree always goes under the larger one, so the height never exceeds lg N."

