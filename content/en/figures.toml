[[t]]
ar = "شجرة نداءات <code>F(5)</code> الساذجة: 15 نداء عشان 6 قيم مختلفة. العقد الباهتة كلها حسابات <b>متكررة</b> — اللي الـ memoization بيشيلها، فتفضل سلسلة واحدة من F5 لـ F0."
en = "The naive call tree of <code>F(5)</code>: 15 calls for 6 distinct values. The faded nodes are all <b>repeated</b> computations, which memoization removes, leaving a single chain from F5 to F0."

[[t]]
ar = "جدول الـ DP للشنطة: لكل سعة من 0 لـ 17، أحسن قيمة وآخر حاجة اتحطت. عشان تبني الحل من 17: خد C (حجم 7) ← سعة 10، خد C ← سعة 3، خد A ← سعة 0. الحل A+C+C = 24."
en = "The DP table for the knapsack: for every capacity from 0 to 17, the best value and the last item added. To rebuild the solution from 17: take C (size 7) to reach capacity 10, take C to reach capacity 3, take A to reach capacity 0. The solution A+C+C = 24."

[[t]]
