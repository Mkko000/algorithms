[partition]
start = "الـ pivot هو v = {v}، آخر عنصر. الـ i بيبدأ قبل أول خانة، والـ j واقف عند الـ pivot."
i_moves = "a[{i}] = {x} أصغر من {v}، فالـ i يكمّل يمين."
i_stops = "a[{i}] = {x} مش أصغر من الـ pivot {v}، فالـ i بيقف هنا."
j_moves = "a[{j}] = {x} أكبر من {v}، فالـ j يكمّل شمال."
j_stops = "a[{j}] = {x} مش أكبر من {v}، فالـ j بيقف هنا."
swap = "المؤشرين وقفوا عند عنصرين في الناحية الغلط. بدّلهم: a[{i}] بقى {x} و a[{j}] بقى {y}."
cross = "الـ i = {i} وصل للـ j = {j}، يعني المؤشرين اتقابلوا واللوب خلص."
place_pivot = "بدّل الـ pivot مع a[{i}]. ده مكانه النهائي."
done = "خلصنا. مفيش حاجة شمال الخانة {i} أكبر من {v}، ومفيش حاجة يمينها أصغر منه."

[selection]
start = "{n} مفتاح. كل لفّة بتدوّر على أصغر مفتاح فاضل وتحطه في مكانه."
new_min = "a[{p}] = {x} أصغر من الـ min الحالي {y}، فالـ min يتنقل لـ {p}."
keep_min = "a[{p}] = {x} مش أصغر من {y}، فالـ min يفضل عند {q}."
swap = "بدّل الأصغر لمكانه: a[{p}] بقى {x}."
done = "اترتبت. كل مفتاح في مكانه النهائي."

[insertion]
start = "{n} مفتاح. الأول بنزق أصغر مفتاح للشمال خالص عشان يبقى sentinel."
sentinel_swap = "{x} أصغر من اللي على شماله {y}، فبيتبدّلوا."
sentinel_keep = "{x} مش أصغر من {y}، فمفيش حاجة بتتحرك."
sentinel_exch = "اتبدّلوا: a[{p}] = {x} و a[{q}] = {y}."
shift = "v = {x} أصغر من a[{q}] = {y}، فالـ {y} يتزحزح خانة يمين."
place = "v = {x} مش أصغر من a[{q}] = {y}، فالـ v ينزل في الفراغ اللي بعده على طول."
done = "اترتبت. كل مفتاح في مكانه النهائي."

[shellsort]
start = "{n} مفتاح. Shellsort بيعمل insertion sort على مفاتيح بينها h خانة، والـ h بتصغر لحد ما توصل 1."
shift = "v = {x} أصغر من a[{q}] = {y} اللي على بعد {h} شمال، فالـ {y} يتنقل {h} خانة يمين."
place = "v = {x} مش أصغر من a[{q}] = {y}، فالـ v ينزل في الفراغ."
done = "اترتبت. اللفّة الأخيرة بـ h = 1 مكانش فاضل لها شغل كتير."

[heap]
start = "heap فاضي. هنضيف {n} مفتاح، وبعدين نشيل الأكبر كام مرة."
insert = "ضيف {x} تحت خالص، في أول ورقة فاضية."
up_swap = "الأب {x} أصغر من الابن {y}، فالـ {y} يطلع لفوق."
up_stop = "الأب {x} مش أصغر من {y}. شرط الـ heap رجع تمام."
swapped = "{x} و {y} بدّلوا مكانهم."
built = "الـ heap فيه {n} مفتاح، والأكبر قاعد في الجذر."
delmax = "شيل الأكبر {x}: بدّله مع آخر ورقة."
removed = "{x} خرج من الـ heap. دلوقتي الجذر الجديد ينزل لمكانه."
kids = "قارن الابنين {x} و {y} عشان نعرف مين الأكبر."
down_swap = "{x} أصغر من الابن الأكبر {y}، فينزل مستوى."
down_stop = "{x} مش أصغر من {y}، فيفضل مكانه. الـ heap اتصلح."
done = "خلصنا. فاضل {n} مفتاح في الـ heap."

[batcher]
start = "{n} مفتاح على {n} سلك. الـ comparators بتشتغل بنفس الترتيب مهما كانت البيانات."
swap = "الـ comparator {i}:{j} لقى الاتنين مش مترتبين فبدّلهم: a[{i}] = {x}، a[{j}] = {y}."
keep = "الـ comparator {i}:{j}: a[{i}] = {x} و a[{j}] = {y} مترتبين أصلًا."
done = "الـ {n} comparator اشتغلوا كلهم. نفس الشبكة دي بترتب أي input بنفس الحجم."

[lsd]
start = "{n} مفتاح، كل واحد {w} حروف. الـ LSD بيرتب على آخر حرف الأول."
pass = "اللفّة {p}: ترتيب مستقر على الحرف رقم {d}. المفاتيح المتساوية بتحتفظ بترتيبها من اللفّة اللي قبلها."
done = "اترتبت بعد لفّة واحدة لكل حرف."

[union-find]
start = "عشر عناصر، كل واحد component لوحده."
halve = "واحنا طالعين للجذور بتاعة {p} و {q}، الـ path halving بيخلّي كل عقدة تشاور على جدّها."
already = "{p} و {q} ليهم نفس الجذر {r}، فمفيش حاجة بتتغير."
link = "الجذرين مختلفين. جذر الشجرة الأصغر {c} بقى يشاور على {r}."
done = "عدد الـ components اللي فاضلة: {n}."

[bst]
start = "شجرة فاضية."
insert = "ضيف {x}، وابدأ من الجذر."
go_left = "{x} أصغر من {y}، فروح شمال."
go_right = "{x} مش أصغر من {y}، فروح يمين."
new_node = "لقينا link فاضي. الـ {x} بقى ورقة جديدة هنا."
done = "في الشجرة {n} مفتاح. الـ inorder بيقراهم مترتبين."

[chaining]
start = "{m} قايمة فاضية."
hash = "hash(\"{x}\") = {b}."
insert = "\"{x}\" بيدخل في أول القايمة {b}، واللي بقى فيها {len}."
done = "{n} مفتاح في {m} قايمة."

[probing]
start = "جدول فاضي فيه {m} خانة."
hash = "الـ hash بتاع {x} بيدّي الخانة {h}."
occupied = "الخانة دي مشغولة، فالـ {x} يجرب اللي بعدها، الخانة {i}."
place = "{x} استقر في الخانة {i}. عدد المحاولات: {p}."
done = "اتحط {n} مفتاح. البحث الناجح بياخد في المتوسط {avg} محاولة."

[recursion]
start = "احسب F({n}) بالطريقة الساذجة: كل نداء بيعمل نداءين كمان."
enter = "نادي F({n})."
base = "F({n}) حالة أساسية: رجّع {v}."
return = "F({n}) = {a} + {b} = {v}."
done = "F({n}) = {v} بعد {c} نداء. بص قد إيه نفس القيم الصغيرة بتتحسب تاني وتالت."

[mergesort]
start = "{n} مفتاح. الـ mergesort بيرتب كل نص لوحده، وبعدين بيدمج النصين المترتبين عن طريق الـ aux."
merge_start = "ادمج a[{l}..{m}] مع a[{m1}..{r}]: النصين مترتبين أصلًا."
copied = "انسخ a[{l}..{r}] في الـ aux، والنص اليمين مقلوب، عشان النصين يتقابلوا في النص ومنحتاجش نتشيك على الأطراف."
take_left = "aux[i] = {x} أصغر من aux[j] = {y}، فالـ {x} يدخل a[{k}]."
take_right = "aux[i] = {x} مش أصغر من aux[j] = {y}، فالـ {y} يدخل a[{k}]."
done = "اترتبت، بعد {c} مقارنة."
